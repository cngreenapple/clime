name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Resolve Cloudflare Account ID
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set +e
          # Global API key + email can hit /user to get the default account id.
          RESP=$(curl -s -H "X-Auth-Email: $CLOUDFLARE_EMAIL" -H "X-Auth-Key: $CLOUDFLARE_API_KEY" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=1")
          echo "$RESP"
          # First account id from the accounts list (global API key + email).
          ACCT=$(echo "$RESP" | grep -o '"id":"[0-9a-f]\{32\}"' | head -1 | grep -o '[0-9a-f]\{32\}')
          if [ -z "$ACCT" ]; then
            echo "::error::Could not resolve account id from /accounts"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCT" >> "$GITHUB_ENV"
          echo "Using account id: $ACCT"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
